description: |-
  This module creates an S3 bucket suitable for receiving logs from other `AWS` services such as `S3`, `CloudFront`, and `CloudTrails`.

  This module implements a configurable log retention policy, which allows you to efficiently manage logs across different storage classes (_e.g._ `Glacier`) and ultimately expire the data altogether.

  It enables server-side default encryption.

  https://docs.aws.amazon.com/AmazonS3/latest/dev/bucket-encryption.html

  It blocks public access to the bucket by default.

  https://docs.aws.amazon.com/AmazonS3/latest/dev/access-control-block-public-access.html
  
  This module is primarily a wrapper around the Raring Group
  [s3-bucket](https://github.com/raringgroup/terraform-aws-s3-bucket)
  module, with some options preconfigured and SQS notifications added. If it does not exactly suit your needs,
  you may want to use the `s3-bucket` module directly.

usage: |-
  ```hcl
  module "log_storage" {
    source = "git::https://github.com/raringgroup/terraform-aws-s3-log-storage.git?ref=v0.1.0"

    context = module.context.self

    name = "logs"
    acl  = "log-delivery-write"

    lifecycle_configuration_rules = [local.lifecycle_configuration_rule]
  }
  ```

  Naming and tagging come from [`terraform-null-context`](https://github.com/raringgroup/terraform-null-context). Add `_context.tf` to the calling configuration and pass `context = module.context.self`.

  This module supports full S3 [storage lifecycle](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html) configuration; see README.md for a complete `lifecycle_configuration_rule` example.

